[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baselane-mcp"
version = "0.1.0"
description = "MCP server for Baselane property finance automation"
readme = "SKILL.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.13.0",
  "requests>=2.31.0",
  "pydantic>=2.0.0",
]

[project.scripts]
baselane-mcp = "baselane_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
